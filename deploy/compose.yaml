# Docker Compose: kronik with its PostgreSQL.
#   docker compose -f deploy/compose.yaml up -d
# Open http://localhost:8080
services:
  kronik:
    image: ghcr.io/rakunlabs/kronik:latest
    restart: unless-stopped
    environment:
      KRONIK_STORE_DSN: postgres://kronik:kronik@postgres:5432/kronik?sslmode=disable
      KRONIK_ENVIRONMENT: sandbox
      # Kubernetes jobs need a cluster; off here (can be turned on from the UI).
      KRONIK_EXECUTOR_KUBERNETES_ENABLED: "false"
    # Docker jobs run containers on this host's engine. The socket is root on
    # the host: leave it out if you do not use Docker jobs.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    # Running jobs get this long to finish on stop (scheduler.shutdown_timeout + margin).
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kronik
      POSTGRES_PASSWORD: kronik
      POSTGRES_DB: kronik
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kronik"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres:
