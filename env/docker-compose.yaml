services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kronik
      POSTGRES_PASSWORD: kronik
      POSTGRES_DB: kronik
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kronik"]
      interval: 2s
      timeout: 3s
      retries: 20
