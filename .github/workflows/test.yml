on: [push]

name: Test
jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kronik
          POSTGRES_PASSWORD: kronik
          POSTGRES_DB: kronik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kronik" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      KRONIK_TEST_DSN: postgres://kronik:kronik@localhost:5432/kronik?sslmode=disable
    steps:
      - name: get repository name
        run: echo "REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
      - uses: actions/checkout@v7
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout 10m --new-from-rev=HEAD~1 --issues-exit-code=0
      - name: Run tests
        run: |
          GOPATH="$(dirname ${PWD})" golangci-lint run --issues-exit-code=0 --output.checkstyle.path=golangci-lint-report.out ./...
          go test -coverprofile=coverage.out -json ./... > test-report.out
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ env.REPOSITORY_NAME }}
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.go.tests.reportPaths=test-report.out
            -Dsonar.go.golangci-lint.reportPaths=golangci-lint-report.out
            -Dsonar.sources=.
            -Dsonar.exclusions=**/vendor/**,**/*_test.go,_ui/node_modules/**,internal/server/dist/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm and Node.js come from _ui/package.json (packageManager and
      # devEngines.runtime), so CI builds with the same versions as local.
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: _ui
          cache: true
          require-lockfile: true
      - name: Type-check and build
        working-directory: _ui
        run: |
          pnpm check
          pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kronik
          POSTGRES_PASSWORD: kronik
          POSTGRES_DB: kronik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kronik" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: _ui
          cache: true
          require-lockfile: true
      - name: Build
        run: |
          cd _ui && pnpm build && cd ..
          go build -o /tmp/kronik ./cmd/kronik
      - name: Start kronik
        run: /tmp/kronik > /tmp/kronik.log 2>&1 &
        env:
          KRONIK_STORE_DSN: postgres://kronik:kronik@localhost:5432/kronik?sslmode=disable
          KRONIK_SERVER_PORT: "18181"
          KRONIK_SECRETS_KEY: e2e master key for the tests
          KRONIK_EXECUTOR_DOCKER_ENABLED: "false"
          KRONIK_EXECUTOR_SWARM_ENABLED: "false"
          KRONIK_EXECUTOR_KUBERNETES_ENABLED: "false"
      - name: Install the browser
        working-directory: _ui
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: _ui
        run: |
          for i in $(seq 30); do curl -sf http://127.0.0.1:18181/healthz && break; sleep 1; done
          pnpm e2e
        env:
          KRONIK_E2E_URL: http://127.0.0.1:18181/
      - name: kronik log
        if: failure()
        run: cat /tmp/kronik.log
